<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatiseringsuppgift</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    
    <div class="wrapper">
        <header>
            <div class="lightswitch">
                <label>Färgtema:</label><br>

                <select id="theme-select">
                    <option id="theme-system" value="light-dark">System</option>
                    <option id="theme-light" value="light">Ljus</option>
                    <option id="theme-dark" value="dark">Mörk</option>
                </select>
            </div>
            

            <h1>Automatisering & publicering</h1>
            <p class="slogan">Front-end baserad webbutveckling</p>
        </header>

        <aside>
            <nav>
                <ul>
                    <li><a href="/">Startsida</a></li>
                    <li><a href="/bilder" class="active">Bilder</a></li>
                    <li><a href="/arbetsprocessen">Arbetsprocessen</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <h2>Bilder</h2>
            
            <div class="picture-block">
                <img src="src/img/pic1.jpg" alt="" class="picture">
                <img src="src/img/pic2.jpg" alt="" class="picture">
                <img src="src/img/pic3.jpg" alt="" class="picture">
                <img src="src/img/pic4.jpg" alt="" class="picture">
                <img src="src/img/pic5.jpg" alt="" class="picture">
                <img src="src/img/pic6.jpg" alt="" class="picture">
            </div>

            <p class="photo-tag">Pictures from: <a href="unsplash.com">Unsplash.com</a></p>
                    

        </main>

        <footer>
                &copy; Kevin Maninnerby <br>
                webbutvecklingsprogrammet MIUN
        </footer>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
